name: Publish

# Publishes @surf-ai/surf-mcp to npm with trusted publishing (GitHub OIDC).
# There is no npm token: the npm package trusts only this workflow file running
# in the `npm-publish` environment, and every version gets a provenance
# statement. Release by merging a package.json version bump to main, then
# pushing the matching `v<version>` tag on that main commit.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tag to point at a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Tag a main commit."
            exit 1
          fi

      - name: Check the tag against package.json
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not v<semver>."
            exit 1
          fi
          PACKAGE_VERSION="$(jq -r .version package.json)"
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION}. Bump package.json on main first."
            exit 1
          fi
          case "$VERSION" in
            *-alpha*) NPM_TAG=alpha ;;
            *-beta*) NPM_TAG=beta ;;
            *-rc*) NPM_TAG=rc ;;
            *-*) echo "::error::Prerelease ${VERSION} must be -alpha, -beta or -rc."; exit 1 ;;
            *) NPM_TAG=latest ;;
          esac
          echo "npm_tag=${NPM_TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION} with npm dist-tag ${NPM_TAG}"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
          no-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck, test and build
        run: |
          bun run typecheck
          bun test
          bun run build

      - name: Pack
        run: |
          mkdir -p pack
          npm pack --pack-destination pack
          ls -l pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # Protected environment: required reviewers and a `v*` tag deployment rule.
    # The npm trusted publisher accepts only this workflow in this environment.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Require npm with trusted publishing support
        run: |
          NPM_VERSION="$(npm --version)"
          if ! printf '%s\n%s\n' "11.5.1" "$NPM_VERSION" | sort -V -C; then
            echo "::error::npm ${NPM_VERSION} is older than 11.5.1, which trusted publishing needs."
            exit 1
          fi
          echo "npm ${NPM_VERSION}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: pack

      # No install or build here: this job holds the OIDC token, so no
      # dependency lifecycle script runs in it. It publishes the tarball the
      # build job tested.
      - name: Publish with provenance
        env:
          NPM_TAG: ${{ needs.build.outputs.npm_tag }}
        run: |
          set -- pack/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected exactly one package tarball."
            exit 1
          fi
          npm publish "$1" --provenance --access public --tag "$NPM_TAG"

      - name: Summary
        env:
          NPM_TAG: ${{ needs.build.outputs.npm_tag }}
        run: |
          {
            echo "## Published ${GITHUB_REF_NAME} (npm dist-tag: ${NPM_TAG})"
            echo
            echo "- \`@surf-ai/surf-mcp@${GITHUB_REF_NAME#v}\` with provenance"
          } >> "$GITHUB_STEP_SUMMARY"
